<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- The full master (above 32 px): a page with one highlighted line and a comment dot in its
       margin, joined to it. DESIGN.md (Brand). Every other file in brand/ comes from this and
       mark-small.svg through scripts/brand/render.py; only rect, horizontal line and circle. -->
  <g id="ground"><rect width="100" height="100" rx="22.4" fill="#1c1c1e"/></g>
  <g id="page"><rect x="18" y="16" width="48" height="68" rx="5" fill="#f2f2f7"/></g>
  <g id="highlight"><rect x="24" y="38" width="36" height="10" rx="2" fill="#f472b6"/></g>
  <g id="lines">
    <line x1="27" y1="30" x2="57" y2="30" stroke="#1c1c1e" stroke-opacity=".45" stroke-width="5" stroke-linecap="round"/>
    <line x1="27" y1="43" x2="57" y2="43" stroke="#1c1c1e" stroke-opacity=".45" stroke-width="5" stroke-linecap="round"/>
    <line x1="27" y1="56" x2="57" y2="56" stroke="#1c1c1e" stroke-opacity=".45" stroke-width="5" stroke-linecap="round"/>
    <line x1="27" y1="69" x2="46" y2="69" stroke="#1c1c1e" stroke-opacity=".45" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g id="note">
    <line x1="66" y1="43" x2="73" y2="43" stroke="#f472b6" stroke-width="4"/>
    <circle cx="80" cy="43" r="8" fill="#f472b6"/>
  </g>
</svg>
