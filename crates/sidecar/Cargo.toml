[package]
name = "annotary-sidecar"
description = "The `<name>.annotary` JSON Sidecar: fixed key order, deterministic leaf-inline writer, strict reader, the push Binding, and Version identity (also builds to WASM)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = ["std"]
std = ["serde/std", "serde_json/std", "sha2/std"]

[dependencies]
# Declared directly (not via the workspace table) so the no_std / wasm32 build of this crate alone
# does not inherit `preserve_order` (which implies std) or default features.
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
proptest = "1"
