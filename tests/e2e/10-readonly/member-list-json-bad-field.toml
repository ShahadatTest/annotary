# spec: S01-17, S01-18
# An unknown field is a usage error (exit 1) that lists the valid ones — as JSON on stderr under --json.
bin.name = "annotary"
args = ["-p", "rowan", "member", "list", "--json", "nope"]
status.code = 1
stdout = ""
stderr = """
{"error":"usage","message":"unknown --json field 'nope'","hint":"fields: handle name role grants disabled created id"}
"""
