# spec: S01-15, S01-18
# No env token, no --profile, no default profile ⇒ exit 3; the message names the three ways and lists the profiles.
bin.name = "annotary"
args = ["member", "list"]
status.code = 3
stdout = ""
stderr = """
error: no credential — say who you are: pass -p NAME (`annotary profile list` shows whose each one is), or set ANNOTARY_TOKEN
profiles in ~/.annotary/config.toml: agent, down, limited, pw, rowan
"""
