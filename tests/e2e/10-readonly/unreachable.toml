# spec: S01-16, S01-18
# Profile `down` points at a port nobody listens on: exit 6, fast, message names the URL and the hint.
bin.name = "annotary"
args = ["-p", "down", "member", "list"]
status.code = 6
stdout = ""
stderr = """
error: server at http://127.0.0.1:1 not reachable — run `annotary serve` or `annotary daemon install`
"""
