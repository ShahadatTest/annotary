# spec: S18-09
# TTY twin of pair-no-public.
bin.name = "annotary"
args = ["-p", "rowan", "pair"]
env.add = { ANNOTARY_TTY = "1", NO_COLOR = "1" }
status.code = 5
stdout = ""
stderr = """
error: no public URL is set — a phone cannot reach this server's loopback address — annotary serve --url http://HOST:PORT
"""
