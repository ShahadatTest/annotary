# spec: S07-13
# `--status anchored,refined` hides the orphaned Threads (a Document-level Thread would count as
# anchored); no orphaned footer under a status filter.
bin.name = "annotary"
args = ["-p", "agent", "thread", "list", "ra-plan", "--status", "anchored,refined", "--no-color"]
env.add = { ANNOTARY_TTY = "1" }
status = "success"
stdout = """
ID  AUTHOR   ANCHOR                                             BODY                                          REPLIES  AGE
t4  @rowan   asset img/architecture.png                         Diagram is out of date — the daemon box is…            [..]
t5  @scribe  v5:11 "testable in isolation"                      Should the anchor engine be its own package?           [..]
t2  @rowan   v5:16 refined "We ship the CLI before the web UI"  Agreed — but the skill file must land *with…           [..]
"""
stderr = """
2 resolved hidden — `--all` shows them
"""
