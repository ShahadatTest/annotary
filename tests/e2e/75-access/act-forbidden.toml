# spec: S06-01, S06-14
# A Member with `read,comment` on notes only: `act` fails with exit 4 naming the missing Right
# and the `member grant` hint (the ticket's scenario; the reply that succeeds is in 80-access-mut).
bin.name = "annotary"
args = ["-p", "limited", "act", "ro-plan", "approve"]
status.code = 4
stdout = ""
stderr = """
error: missing right `action` on Vault notes (you are @limited) — ask an owner: annotary member grant limited notes action
"""
