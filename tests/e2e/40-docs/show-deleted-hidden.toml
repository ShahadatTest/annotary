# spec: S02-17
# A deleted Document is hidden from show/status by Name: exit 2.
bin.name = "annotary"
args = ["-p", "rowan", "show", "ro-del"]
status.code = 2
stdout = ""
stderr = """
error: no Document "ro-del" — DOC is an id, a Name unique in the Vault, or the path to a pulled .md; `annotary list` shows Documents
"""
