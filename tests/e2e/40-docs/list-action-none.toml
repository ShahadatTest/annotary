# spec: S02-21
# `--action none` = Documents whose head has no Action (all of them until ticket 05).
bin.name = "annotary"
args = ["-p", "rowan", "list", "lst-", "--action", "none", "--limit", "1"]
status = "success"
stdout = """
[..]	lst-a	v1	-	0	[..]
"""
stderr = """
showing 1 of 3 — `--limit N` for more
"""
