# spec: S13-02
# TTY parity: the same fields in the same order, two spaces apart.
bin.name = "annotary"
args = ["daemon", "status"]
env.add = { ANNOTARY_DAEMON_OS = "macos", ANNOTARY_TTY = "1" }
status = "success"
stdout = """
running  pid [..]  since [..]  [URL]  store ~/.annotary/store  log ~/.annotary/logs/server.log  (v0.0.0)
"""
stderr = """
no LaunchAgent installed — `annotary daemon install` keeps the server up after login
"""
